<style>
  .page-nav { display: flex; gap: 3px; padding: 8px 8px 2px; }
  .page-nav a { flex: 1 1 0; min-width: 0; text-align: center; padding: 7px 2px; font-size: 1.15rem; color: #7a5c2e; text-decoration: none; background: #faf6ee; border: 1px solid #e0d4bc; border-radius: 6px; white-space: nowrap; }
  .page-nav a.active { background: #b98c51; color: #fff; font-weight: bold; border-color: #b98c51; }
  @media (max-width: 415px) { .page-nav a { font-size: 1.02rem; } }
  #app { width: 100%; max-width: 415px; margin: auto; }
  .sel { position: relative; display: flex; align-items: center; }
  #input { box-sizing: border-box; color: green; width: 100%; height: 1.7em; margin-top: 0; padding: 0 5px; font-size: 1.5rem; line-height: 1.7em; border: 1px solid #000; }
  .btn_today { color: green; cursor: pointer; height: 80%; font-size: 1.2rem; position: absolute; top: 10%; right: 3rem; background: none; border: none; }
  /* ===== 月份跳转（输入栏下方，左右箭头） ===== */
  .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; background: #fdf8ef; border-bottom: 1px solid #e1e1e1; }
  .month-btn { background: #fff; border: 1px solid #b98c51; color: #b98c51; border-radius: 5px; font-size: 1.25rem; line-height: 1; width: 2.3em; height: 1.9em; cursor: pointer; padding: 0; }
  .month-btn:active { opacity: .7; background: #f7f0e2; }
  .month-label { font-size: 1.35rem; font-weight: 700; color: #5a4632; }
  /* ===== 大吉日标记（董公吉 + 二十八星宿吉，仅红色文字标注） ===== */
  .cal-item-daji { position: absolute; top: .1rem; right: .1rem; font-size: .8rem; font-weight: 700; color: #d41313; background: rgba(255,255,255,.88); border-radius: 3px; padding: 0 3px; line-height: 1.35; z-index: 2; }
  /* ===== 紧凑化覆盖 ===== */
  .cal-item { padding: .35rem 0 !important; }
  .cal-item-day { font-size: 1.8rem; }
  .cal-item-info { font-size: .9rem; }
  .dtr { padding: .15rem 0 !important; }
  .dtrGap { padding: .1rem 0 !important; font-size: 1.4rem; }
  .div_table { font-size: 1.15rem; }
  .div_table .bazi { font-size: 1.9rem; }
  .pan .col0 { line-height: 1.5rem; }
  .pan .col-right { line-height: 1.5rem; }
  .feixing-wrap { gap: .3rem .5rem; }
  .feixing-grid { width: 7.5rem; }
  .feixing-cell { font-size: 1.4rem; }
</style>
</head>

<div id="app">
  <nav class="page-nav">

    <a href="doushu.html">紫微</a>
    <a href="compass.html">罗盘</a>
    <a href="baziHelp.html">使用说明</a>
  </nav>
  <div id="pan" class="pan">
    <div class="sel">
      <input id="input" placeholder="如200012010322">
      <button class="btn_today">今日</button>
    </div>
    <div class="month-nav">
      <button class="month-btn" id="month-prev" type="button" title="上个月">◀</button>
      <div class="month-label" id="month-label"></div>
      <button class="month-btn" id="month-next" type="button" title="下个月">▶</button>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="info" id="info"></div>
  </div>
</div>
