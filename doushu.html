<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫微斗数</title>
<link rel="stylesheet" href="css/bazi.d78872fa.css">
<link rel="stylesheet" href="css/bazi.85d86054.css">
<style>
  html, body { font-family: "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; }
  .page-nav { display: flex; align-items: center; padding: 5px 10px; border-bottom: 1px solid #e1e1e1; max-width: 415px; margin: auto; }
  .page-nav a { color: #b98c51; text-decoration: none; font-size: 1.5rem; margin-right: 10px; }
  .page-nav a.active { font-weight: bold; }
  .doushu-container { max-width: 415px; margin: 0 auto; padding: 0 8px; }
  .doushu-container h1 { color: #b98c51; padding: 6px 0; font-size: 1.7rem; font-weight: 400; }
  /* 输入控制条 */
  .ctrl-bar { background: #fbfbfb; border: 1px solid #e1e1e1; border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; }
  .ctrl-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font-size: 1.25rem; margin: 2px 0; }
  .ctrl-row label { cursor: pointer; }
  #zw-input { flex: 1; min-width: 150px; padding: 3px 6px; border: 1px solid #888; font-size: 1.3rem; box-sizing: border-box; }
  .ctrl-btn { cursor: pointer; padding: 3px 9px; border: 1px solid #888; background: #fff; border-radius: 4px; font-size: 1.15rem; }
  .ctrl-btn.primary { background: #b98c51; color: #fff; border-color: #b98c51; }
  .ctrl-btn:hover { background: #f5e9d8; }
  .ctrl-btn.primary:hover { background: #a07b46; }
  .ctrl-tip { font-size: 1.0rem; color: #999; padding: 2px 0 0; }
  /* 时辰增减 */
  .hour-btn { flex: 0 0 auto; font-weight: bold; }
  /* 十二宫固定高度：切换流年/大限时内容增减不跳动（约7行） */
  .zw-cell { min-height: 108px; display: flex; flex-direction: column; }
  .zw-stars { flex: 1 1 auto; }
  /* 常见格局 */
  .zw-geju { display: flex; flex-wrap: wrap; gap: 4px; }
  .zw-geju-item { border: 1px solid #c9b089; background: #fdf8ef; color: #7a5c2e; border-radius: 10px; padding: 1px 9px; font-size: 1.0rem; cursor: pointer; }
  .zw-geju-item:hover { background: #f5e9d8; }
  .zw-geju-none { color: #999; font-size: 1.05rem; }
  /* 全站统一切换导航：6 格等宽、字号一致、不左右变动 */
  .page-nav { display: flex; gap: 3px; padding: 8px 8px 2px; }
  .page-nav a { flex: 1 1 0; min-width: 0; text-align: center; padding: 7px 2px; font-size: 1.15rem; color: #7a5c2e; text-decoration: none; background: #faf6ee; border: 1px solid #e0d4bc; border-radius: 6px; white-space: nowrap; }
  .page-nav a.active { background: #b98c51; color: #fff; font-weight: bold; border-color: #b98c51; }
  @media (max-width: 415px) { .page-nav a { font-size: 1.02rem; } }
  /* 信息块 */
  .info-box { background: #fbfbfb; border: 1px solid #e1e1e1; border-radius: 4px; padding: 6px 8px; margin: 5px 0; font-size: 1.25rem; }
  .info-box p { padding: 2px 0; line-height: 1.5; }
  .info-box strong { color: #b98c51; }
  /* 五行颜色 */
  .c-gold { color: #ffa436; }
  .c-wood { color: #228b22; }
  .c-water { color: #007bff; }
  .c-fire { color: #d41313; }
  .c-earth { color: #a17323; }
  /* 紫微盘面 */
  .zw-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin: 6px 0; }
  .zw-cell { border: 1px solid #888; border-radius: 2px; padding: 2px; background: #fff; }
  .zw-cell.empty { border-color: transparent; min-height: 0; }
  .zw-cell.ming { background: #fff8e1; border-color: #b98c51; }
  .zw-cell.shen { box-shadow: inset 0 0 0 2px #f0e6d0; }
  .zw-cell-head { font-weight: bold; color: #b98c51; text-align: center; padding: 0; border-bottom: 1px solid #eee; font-size: 0.72em; line-height: 1.35; }
  .zw-daxian { text-align: center; font-size: 0.6em; color: #999; padding: 0; line-height: 1.3; }
  .zw-stars { padding: 1px 0; }
  .zw-star { display: flex; justify-content: center; align-items: center; padding: 0; font-size: 0.7em; line-height: 1.25em; }
  .hua-mark { font-size: 0.6em; margin-left: 1px; font-weight: bold; }
  .hua-mark.禄 { color: #228b22; }
  .hua-mark.权 { color: #b98c51; }
  .hua-mark.科 { color: #007bff; }
  .hua-mark.忌 { color: #d41313; }
  .btn-group { display: flex; gap: 8px; margin: 10px 0; }
  .btn { padding: 6px 14px; background: #b98c51; color: #fff; border: 0; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 1.3rem; }
  .btn:hover { background: #a07b46; }
  /* 紫微增强：星曜亮度/流年星/宫干四化/流年命宫/大限命宫/释义弹窗 */
  .zw-bright { font-size: 0.55em; margin-left: 1px; font-weight: bold; }
  .zw-lnstar { color: #6b98c0; font-size: 0.66em !important; }
  .zw-gonghua { font-size: 0.58em; color: #888; text-align: center; padding: 0; line-height: 1.2; }
  .zw-cell.lngong { box-shadow: inset 0 0 0 2px #6b98c0; }
  .zw-cell.dxgong { box-shadow: inset 0 0 0 2px #b98c51; }
  .zw-dxmark { color: #b98c51; font-weight: bold; }
  .zw-star-click { cursor: pointer; }
  .zw-star-click:hover { background: #f5e9d8; border-radius: 2px; }
  .zw-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.4); z-index: 1000; display: none; }
  .zw-modal-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #fff; border-radius: 8px; padding: 14px 18px; max-width: 320px; width: 86%; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
  .zw-modal-title { font-size: 1.4rem; font-weight: bold; color: #b98c51; margin-bottom: 6px; }
  .zw-modal-desc { font-size: 1.15rem; color: #555; line-height: 1.6; }
  .zw-modal-close { position: absolute; top: 6px; right: 12px; cursor: pointer; font-size: 1.6rem; color: #999; }
  /* 中间横排四柱 + 大运流年条 */
  .zw-center-cell { grid-column: span 2; grid-row: span 2; border: 1px solid #888; border-radius: 2px; background: #fdf8ef; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .zw-center-bazi { display: flex; flex-direction: column; gap: 1px; align-items: center; }
  .zw-cb-row { display: flex; gap: 5px; font-size: 1.05em; line-height: 1.25; }
  .zw-cb-row span { width: 1.3em; text-align: center; }
  .zw-cb-head span { color: #b98c51; font-weight: bold; font-size: 0.8em; }
  .zw-center-info { font-size: 0.95em; color: #b98c51; font-weight: bold; }
  .zw-center-info2 { font-size: 0.8em; color: #999; }
  .zw-bar-title { font-size: 1.05rem; color: #b98c51; font-weight: bold; margin-bottom: 3px; }
  .zw-bar { display: flex; flex-wrap: wrap; gap: 3px; }
  .zw-bar-item { border: 1px solid #ddd; border-radius: 3px; padding: 2px 5px; font-size: 0.95em; text-align: center; cursor: pointer; line-height: 1.3; }
  .zw-bar-item span { display: block; font-size: 0.75em; color: #999; }
  .zw-bar-item.cur { border-color: #b98c51; background: #fdf8ef; font-weight: bold; }
  .zw-bar-item:hover { background: #f5e9d8; }
  @media (max-width: 415px) { html { font-size: 2.5vw; } }
</style>
</head>
<body>
<div class="page-nav">
  <a href="index.html">八字排盘</a>
  <a href="jinkoujue.html">金口诀</a>
  <a href="rili.html">黄历</a>
  <a href="baziHelp.html">使用说明</a>
  <a href="doushu.html" class="active">紫微</a>
  <a href="compass.html">罗盘</a>
</div>
<div class="doushu-container">
  <h1>紫微斗数排盘</h1>

  <!-- 输入控制条 -->
  <div class="ctrl-bar">
    <div class="ctrl-row">
      <label>时间：</label>
      <button class="ctrl-btn hour-btn" id="zw-hour-prev" title="前一时辰（-2小时）">◀时</button>
      <input id="zw-input" type="text" placeholder="200012010322" maxlength="14">
      <button class="ctrl-btn hour-btn" id="zw-hour-next" title="后一时辰（+2小时）">时▶</button>
    </div>
    <div class="ctrl-row">
      <label><input type="radio" name="zw-gender" id="zw-man" value="1" checked> 男</label>
      <label><input type="radio" name="zw-gender" id="zw-woman" value="0"> 女</label>
      <button class="ctrl-btn primary" id="zw-pp">排盘</button>
      <button class="ctrl-btn" id="zw-now">此刻</button>
    </div>
    <p class="ctrl-tip">输入公历时间（年月日时分，12位），可选男/女。如：200012010322。</p>
    <div class="ctrl-row">
      <label>流年 <input type="number" id="zw-liunian" placeholder="2026" min="1900" max="2100" style="width:4.5em;"></label>
      <label>显示 <select id="zw-mode">
        <option value="ben">本命盘</option>
        <option value="liunian">流年盘</option>
        <option value="die">叠盘</option>
      </select></label>
      <label>四化 <select id="zw-huatype">
        <option value="year">生年四化</option>
        <option value="daxian">大限四化</option>
        <option value="liunian">流年四化</option>
      </select></label>
      <label>流派 <select id="zw-school">
        <option value="sanhe">三合盘</option>
        <option value="feixing">飞星盘</option>
      </select></label>
      <input type="hidden" id="zw-daxian" value="-1">
    </div>
  </div>

  <div id="zw-pan">
    <div class="info-box" id="birth-info"><p>正在排盘...</p></div>
  </div>
  <nav class="page-nav">
    <a href="index.html">八字排盘</a>
    <a href="jinkoujue.html">金口诀</a>
    <a href="rili.html">黄历</a>
    <a href="doushu.html" class="active">紫微</a>
    <a href="compass.html">罗盘</a>
    <a href="baziHelp.html">使用说明</a>
  </nav>
  <!-- 星曜释义弹窗 -->
  <div class="zw-modal" id="zw-modal"><div class="zw-modal-box">
    <span class="zw-modal-close" id="zw-modal-close">×</span>
    <div class="zw-modal-title" id="zw-modal-title"></div>
    <div class="zw-modal-desc" id="zw-modal-desc"></div>
  </div></div>
</div>
<script src="js/lunar.js?v=20260808c"></script>
<script src="js/shensha_data.js?v=20260808c"></script>
<script src="js/utils.js?v=20260808c"></script>
<script src="js/jquery.min.js?v=20260808c"></script>
<script src="js/ziwei.js?v=20260808c"></script>
<script>
$(function () {
  function getV() {
    const params = new URLSearchParams(location.search);
    let v = params.get('v');
    if (!v) {
      const now = Solar.fromDate(new Date());
      v = now.toYmdHms().replace(/[- :]/gim, '').substr(0, 12);
    }
    return v;
  }
  function getGender() {
    const params = new URLSearchParams(location.search);
    const gParam = params.get('gender');
    if (gParam) return gParam === '0' ? 0 : 1;
    return $('#zw-man').prop('checked') ? 1 : 0;
  }
  function renderPan() {
    const raw = $('#zw-input').val().trim();
    if (!raw) {
      $('#birth-info').html('<p style="color:#c00">请先输入公历时间（12位数字）。</p>');
      return;
    }
    // 去掉非数字
    const v = raw.replace(/[^\d]/g, '');
    if (v.length < 8) {
      $('#birth-info').html('<p style="color:#c00">时间格式错误，至少需要8位（年月日）。</p>');
      return;
    }
    const y = parseInt(v.substr(0, 4), 10);
    const m = parseInt(v.substr(4, 2), 10);
    const d = parseInt(v.substr(6, 2), 10);
    const h = v.length >= 10 ? parseInt(v.substr(8, 2), 10) : 12;
    const mi = v.length >= 12 ? parseInt(v.substr(10, 2), 10) : 0;
    const gender = getGender();
    try {
      const solar = Solar.fromYmdHms(y, m, d, h, mi, 0);
      const pan = ZiWei.paiPan(solar, gender);
      $('#zw-pan').html(ZiWei.render(pan));
      // 同步 URL
      const url = new URL(location.href);
      url.searchParams.set('v', v);
      url.searchParams.set('gender', gender);
      history.replaceState(null, '', url.toString());
    } catch (e) {
      $('#birth-info').html('<p style="color:#c00">排盘出错：' + e.message + '</p>');
    }
  }

  // 初始化
  $('#zw-input').val(getV());
  if (getGender() === 0) $('#zw-woman').prop('checked', true);
  // 流年默认值（必须在首次 renderPan 之前设置，否则流年条会以出生年为中心）
  if (!$('#zw-liunian').val()) $('#zw-liunian').val(new Date().getFullYear());
  renderPan();

  // 排盘按钮
  $('#zw-pp').on('click', renderPan);
  // 此刻
  $('#zw-now').on('click', function () {
    const now = Solar.fromDate(new Date());
    $('#zw-input').val(now.toYmdHms().replace(/[- :]/gim, '').substr(0, 12));
    renderPan();
  });
  // 回车提交
  $('#zw-input').on('keypress', function (e) {
    if (13 === e.which) { e.preventDefault(); renderPan(); }
  });
  // 性别切换
  $('input[name=zw-gender]').on('change', renderPan);
  // 流年/模式/四化/流派联动
  $('#zw-liunian,#zw-mode,#zw-huatype,#zw-school').on('input change', renderPan);
  // 星曜释义弹窗（事件委托，盘面重绘后仍生效）
  $('#zw-pan').on('click', '.zw-star-click', function () {
    var nm = $(this).data('star');
    var desc = (window.ZiWei.STAR_DESC && ZiWei.STAR_DESC[nm]) || '暂无释义';
    $('#zw-modal-title').text(nm);
    $('#zw-modal-desc').text(desc);
    $('#zw-modal').css('display', 'block');
  });
  $('#zw-modal-close, #zw-modal').on('click', function (e) {
    if (e.target === this) $('#zw-modal').css('display', 'none');
  });
  // 大限条点击：切换大限四化 + 盘面大限标记 + 下方流年条更新为该大限10年
  $('#zw-pan').on('click', '.zw-bar-item[data-dx]', function () {
    $('#zw-daxian').val($(this).data('dx'));
    $('#zw-huatype').val('daxian');
    $('#zw-mode').val('ben'); // 回到本命盘，显示大限命宫标记与四化
    renderPan();
  });
  // 流年条点击：切换流年（范围不变），盘面显示流年星与流年四化
  $('#zw-pan').on('click', '.zw-bar-item[data-ln]', function () {
    $('#zw-liunian').val($(this).data('ln'));
    $('#zw-mode').val('liunian'); // 盘面叠加流年星
    $('#zw-huatype').val('liunian'); // 四化切到流年
    renderPan();
  });
  // 时辰增减（±2小时，跨日自动进位）
  function shiftHour(delta) {
    const raw = $('#zw-input').val().trim();
    const v = raw.replace(/[^\d]/g, '');
    if (v.length < 8) return;
    const y = parseInt(v.substr(0, 4), 10);
    const m = parseInt(v.substr(4, 2), 10);
    const d = parseInt(v.substr(6, 2), 10);
    const h = v.length >= 10 ? parseInt(v.substr(8, 2), 10) : 12;
    const mi = v.length >= 12 ? parseInt(v.substr(10, 2), 10) : 0;
    const dt = new Date(y, m - 1, d, h, mi);
    dt.setHours(dt.getHours() + delta * 2);
    const pad = function (n) { return String(n).padStart(2, '0'); };
    $('#zw-input').val('' + dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()) + pad(dt.getHours()) + pad(dt.getMinutes()));
    renderPan();
  }
  $('#zw-hour-prev').on('click', function () { shiftHour(-1); });
  $('#zw-hour-next').on('click', function () { shiftHour(1); });
  // 格局点击：弹窗解说（复用星曜释义弹窗）
  $('#zw-pan').on('click', '.zw-geju-click', function () {
    $('#zw-modal-title').text($(this).data('geju'));
    $('#zw-modal-desc').text($(this).data('desc'));
    $('#zw-modal').css('display', 'block');
  });
});
</script>
</body>
</html>
