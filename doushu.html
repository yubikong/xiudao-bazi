<script>
// ============ 紫微 AI 分析（复制 markdown） ============
function zwCopyAI() {
  const pan = window._zwPan;
  if (!pan) return '';
  const info = pan.info;
  const pad = function (n) { return String(n).padStart(2, '0'); };
  const s0 = info.solar;
  const g = info.gender === 1 ? '男' : '女';
  let s = '# 紫微斗数命盘\n';
  s += '- 出生：北京时间' + info.birthYear + '年' + s0.getMonth() + '月' + s0.getDay() + '日 ' + pad(s0.getHour()) + ':' + pad(s0.getMinute()) + '（' + g + '）\n';
  s += '- 五行局：' + (info.juName || '') + '　命主：' + info.mingZhu + '　身主：' + info.shenZhu + '\n';
  s += '- 命宫：' + info.mingGong + '宫　身宫：' + info.shenGong + '宫\n\n';
  s += '## 十二宫\n';
  pan.palaces.forEach(function (p) {
    s += '\n### ' + p.name + '（' + p.zhi + '宫）\n';
    const stars = p.stars.map(function (st) {
      const b = pan.BRIGHT[st] ? (pan.BRIGHT[st][p.zhiIdx] || '') : '';
      return st + (b ? '（' + b + '）' : '');
    }).join('、');
    s += '- 本命星：' + (stars || '无');
    if (p.minor && p.minor.length) s += '\n- 杂耀：' + p.minor.join('、');
    if (p.hua && p.hua.length) s += '\n- 四化：' + p.hua.map(function (h) { return h.hua + '（' + h.star + '）'; }).join('、');
    if (p.suiQian || p.jiangQian) s += '\n- 神煞：岁前' + (p.suiQian || '—') + '、将前' + (p.jiangQian || '—');
    s += '\n- 大限：' + p.daXian;
    if (p.xiaoXian && p.xiaoXian.length) s += '\n- 小限：' + p.xiaoXian.slice(0, 4).join('、') + '岁…';
  });
  // 流年
  const liuYear = parseInt($('#zw-liunian').val(), 10) || new Date().getFullYear();
  const ln = ZiWei.calcLiuNian(pan, liuYear);
  s += '\n\n## 流年运势（' + liuYear + '年 ' + ln.gan + ln.zhi + '）\n';
  s += '- 流年命宫：' + pan.palaces[ln.gongIdx].name + '宫\n';
  const lnHua = [];
  for (const hk in ln.hua) lnHua.push(hk + '（' + ln.hua[hk].star + '）');
  if (lnHua.length) s += '- 流年四化：' + lnHua.join('、') + '\n';
  const lnStars = [];
  for (const lsk in ln.stars) lnStars.push(lsk + '（' + pan.palaces[ln.stars[lsk]].zhi + '宫）');
  if (lnStars.length) s += '- 流年星：' + lnStars.join('、') + '\n';
  s += '- 流年小限：' + pan.palaces[ln.xiaoXianIdx].name + '宫\n';
  s += '\n' + '你是一位精通紫微斗数的命理顾问（结合三合派与飞星派）。请基于以上命盘数据（已由程序排定，勿自行排盘）进行分析，按以下步骤分点输出：\n1. 命宫主星庙旺平陷与性格底色；\n2. 三方四正（命、财帛、官禄、迁移）核心格局；\n3. 生年四化（禄权科忌）落宫与今生课题；\n4. 大限、小限与流年运势走势。星曜特性结合庙旺平陷解读，专业术语加白话括注。';
  return s;
}
function zwClip(text, btn) {
  function ok() { if (btn) { const o = btn.textContent; btn.textContent = '已复制✓'; setTimeout(function () { btn.textContent = o; }, 1200); } }
  function fb() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok).catch(fb);
  else fb();
}
$(function () {
  function getV() {
    const params = new URLSearchParams(location.search);
    let v = params.get('v');
    if (!v) {
      const now = Solar.fromDate(new Date());
      v = now.toYmdHms().replace(/[- :]/gim, '').substr(0, 12);
    }
    return v;
  }
  function getGender() {
    const params = new URLSearchParams(location.search);
    const gParam = params.get('gender');
    if (gParam) return gParam === '0' ? 0 : 1;
    return $('#zw-man').prop('checked') ? 1 : 0;
  }
  function renderPan() {
    const raw = $('#zw-input').val().trim();
    if (!raw) {
      $('#zw-msg').html('<p style="color:#c00">请先输入公历时间（12位数字）。</p>');
      return;
    }
    // 去掉非数字
    const v = raw.replace(/[^\d]/g, '');
    if (v.length < 8) {
      $('#zw-msg').html('<p style="color:#c00">时间格式错误，至少需要8位（年月日）。</p>');
      return;
    }
    const y = parseInt(v.substr(0, 4), 10);
    const m = parseInt(v.substr(4, 2), 10);
    const d = parseInt(v.substr(6, 2), 10);
    const h = v.length >= 10 ? parseInt(v.substr(8, 2), 10) : 12;
    const mi = v.length >= 12 ? parseInt(v.substr(10, 2), 10) : 0;
    const gender = getGender();
    try {
      const solar = Solar.fromYmdHms(y, m, d, h, mi, 0);
      const pan = ZiWei.paiPan(solar, gender);
      window._zwPan = pan;
      $('#zw-pan').html(ZiWei.render(pan));
      // 同步 URL
      const url = new URL(location.href);
      url.searchParams.set('v', v);
      url.searchParams.set('gender', gender);
      history.replaceState(null, '', url.toString());
    } catch (e) {
      $('#zw-msg').html('<p style="color:#c00">排盘出错：' + e.message + '</p>');
    }
  }

  // 初始化
  $('#zw-input').val(getV());
  if (getGender() === 0) $('#zw-woman').prop('checked', true);
  // 流年默认值（必须在首次 renderPan 之前设置，否则流年条会以出生年为中心）
  if (!$('#zw-liunian').val()) $('#zw-liunian').val(new Date().getFullYear());
  renderPan();

  // 八字跳转：携带当前紫微日期+性别
  $('.page-nav a[href="index.html"]').on('click', function (e) {
    e.preventDefault();
    const v = $('#zw-input').val().replace(/[^\d]/g, '');
    const gender = $('#zw-man').prop('checked') ? 1 : 0;
    location.href = 'index.html?v=' + v + '&gender=' + gender;
  });

  // 排盘按钮
  $('#zw-pp').on('click', renderPan);
  // 此刻
  $('#zw-now').on('click', function () {
    const now = Solar.fromDate(new Date());
    $('#zw-input').val(now.toYmdHms().replace(/[- :]/gim, '').substr(0, 12));
    renderPan();
  });
  // 回车提交
  $('#zw-input').on('keypress', function (e) {
    if (13 === e.which) { e.preventDefault(); renderPan(); }
  });
  // 性别切换
  $('input[name=zw-gender]').on('change', renderPan);
  // 流年/模式/四化/流派联动
  $('#zw-liunian,#zw-mode,#zw-huatype,#zw-school').on('input change', renderPan);
  // 星曜释义弹窗（事件委托，盘面重绘后仍生效）
  $('#zw-pan').on('click', '.zw-star-click', function () {
    var nm = $(this).data('star');
    var desc = (window.ZiWei.STAR_DESC && ZiWei.STAR_DESC[nm]) || '暂无释义';
    $('#zw-modal-title').text(nm);
    $('#zw-modal-desc').text(desc);
    $('#zw-modal').css('display', 'block');
  });
  $('#zw-modal-close, #zw-modal').on('click', function (e) {
    if (e.target === this) $('#zw-modal').css('display', 'none');
  });
  // 大限条点击：切换大限四化 + 盘面大限标记 + 下方流年条更新为该大限10年
  $('#zw-pan').on('click', '.zw-bar-item[data-dx]', function () {
    $('#zw-daxian').val($(this).data('dx'));
    $('#zw-huatype').val('daxian');
    $('#zw-mode').val('ben'); // 回到本命盘，显示大限命宫标记与四化
    renderPan();
  });
  // 流年条点击：切换流年（范围不变），盘面显示流年星与流年四化
  $('#zw-pan').on('click', '.zw-bar-item[data-ln]', function () {
    $('#zw-liunian').val($(this).data('ln'));
    $('#zw-mode').val('liunian'); // 盘面叠加流年星
    $('#zw-huatype').val('liunian'); // 四化切到流年
    renderPan();
  });
  // 时辰增减（±2小时，跨日自动进位）
  function shiftHour(delta) {
    const raw = $('#zw-input').val().trim();
    const v = raw.replace(/[^\d]/g, '');
    if (v.length < 8) return;
    const y = parseInt(v.substr(0, 4), 10);
    const m = parseInt(v.substr(4, 2), 10);
    const d = parseInt(v.substr(6, 2), 10);
    const h = v.length >= 10 ? parseInt(v.substr(8, 2), 10) : 12;
    const mi = v.length >= 12 ? parseInt(v.substr(10, 2), 10) : 0;
    const dt = new Date(y, m - 1, d, h, mi);
    dt.setHours(dt.getHours() + delta * 2);
    const pad = function (n) { return String(n).padStart(2, '0'); };
    $('#zw-input').val('' + dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()) + pad(dt.getHours()) + pad(dt.getMinutes()));
    renderPan();
  }
  $('#zw-hour-prev').on('click', function () { shiftHour(-1); });
  $('#zw-hour-next').on('click', function () { shiftHour(1); });
  // 格局点击：弹窗解说（复用星曜释义弹窗）
  $('#zw-pan').on('click', '.zw-geju-click', function () {
    $('#zw-modal-title').text($(this).data('geju'));
    $('#zw-modal-desc').text($(this).data('desc'));
    $('#zw-modal').css('display', 'block');
  });
  // AI 分析（复制 markdown）
  $('#zw-ai-btn').on('click', function () { if (window._zwPan) zwClip(zwCopyAI(), this); });
});
</script>
</body>
</html>
